name: Verify Buck runtime-version protection
on:
  push:
    branches: ['ops/buck-version-guard-submit-20261104']
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 2fce0ede30556f7deb52869765d36bc85849685c
          path: ee
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reconstruct tested correction without touching main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ee rev-parse HEAD)" = 2fce0ede30556f7deb52869765d36bc85849685c
          cat driver/.migration-guard/part-*.b64 | base64 --decode > /tmp/runtime-version-fix.xz
          echo 'b9b6600a8cd22c4612a207634099f0db831c8156edfa89b2780e99550e148ec8  /tmp/runtime-version-fix.xz' | sha256sum --check
          xz --decompress --stdout /tmp/runtime-version-fix.xz > /tmp/runtime-version-fix.patch
          git -C ee apply --check /tmp/runtime-version-fix.patch
          git -C ee apply /tmp/runtime-version-fix.patch
          git -C ee add -A
          git -C ee diff --cached --check
          test "$(git -C ee write-tree)" = ec3fd8fcb1d20854b0d2d2c48ffce3e21490c6fc
      - name: Verify engineering, source and version-protection tests
        working-directory: ee
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:ci | tee /tmp/runtime-version-unit.log
          git add -A
          test "$(git write-tree)" = ec3fd8fcb1d20854b0d2d2c48ffce3e21490c6fc
      - name: Publish verified result branch only
        working-directory: ee
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/migration/buck-workbench-20261104 | cut -f1)" = 2fce0ede30556f7deb52869765d36bc85849685c
          if test -n "$(git ls-remote origin refs/heads/migration/buck-version-guard-result-20261104)"; then
            echo 'Refusing to replace existing result branch'; exit 1
          fi
          git config user.name 'Zerofivem'
          git config user.email '15869648+linwuyen@users.noreply.github.com'
          git checkout -b migration/buck-version-guard-result-20261104
          git commit -m 'fix: suspend Buck workbench before incompatible runtime evidence is normalized' -m 'Validate raw schema before storage handlers, user actions and navigation flush. Preserve original evidence owner bytes and unsupported primary data; permit readonly backup in a new tab without abandoning volatile work. Add actual-owner regression, runtime V6 two-tab browser case and update provenance. Local and runner test:ci pass; exact-head browser/review remain required.'
          test "$(git rev-parse HEAD^{tree})" = ec3fd8fcb1d20854b0d2d2c48ffce3e21490c6fc
          git push origin HEAD:refs/heads/migration/buck-version-guard-result-20261104
          git show -s --format='%H%n%T%n%B' HEAD > /tmp/runtime-version-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: buck-version-guard-evidence
          path: |
            /tmp/runtime-version-unit.log
            /tmp/runtime-version-commit.txt
          if-no-files-found: warn
          retention-days: 7
