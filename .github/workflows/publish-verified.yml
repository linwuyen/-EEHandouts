name: Publish EEHandouts only after verified CI

# Source = GitHub Actions and repository variable EEHANDOUTS_ACTIONS_PAGES=true.
# Deploy only a verified SHA that is STILL the current main HEAD.
on:
  workflow_run:
    workflows: ["Verify EEHandouts"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Keep all completed-CI events queued: an older CI must not cancel a newer
# verified deployment, even when those workflow_run events arrive out of order.
concurrency:
  group: verified-pages
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && vars.EEHANDOUTS_ACTIONS_PAGES == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the exact SHA that passed browser regression
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip a stale CI result before packaging
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: bash scripts/check-verified-head.sh
      - name: Prepare SHA-512-verified local PDF.js assets
        if: steps.freshness.outputs.current == 'true'
        run: bash scripts/prepare-pdfjs.sh
      - name: Stamp exact verified SHA into the Pages artifact
        if: steps.freshness.outputs.current == 'true'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: printf '%s\\n' "$VERIFIED_SHA" > release-sha.txt
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@v6
      - name: Package static website
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Recheck latest main SHA immediately before deploy
        id: final_freshness
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: bash scripts/check-verified-head.sh
      - name: Deploy only the newest verified SHA
        id: deployment
        if: steps.final_freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v5
      - name: Verify hosted release SHA and all three entry pages
        if: steps.deployment.outcome == 'success'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: bash scripts/check-published-head.sh
