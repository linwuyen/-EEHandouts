name: Diagnose existing P106 fallback on PR49
on:
  push:
    branches: ['ops/pr49-opamp-diagnose-20261106']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2d6c8a04733f0fb017dd382aba55f463e012663d
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: |
          test "$(git rev-parse HEAD^{tree})" = fbd89a58d3dcd434ab020ae0f041649ce6b5876f
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps firefox webkit
          bash scripts/prepare-pdfjs.sh
      - name: Add failure evidence to disposable test copy only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tests/review-fixes-smoke.mjs').read_text()
          old=' }finally{await browser.close();}'
          assert s.count(old)==1
          replacement=''' }catch(error){
           console.error('P106 DIAGNOSTIC',name,error);
           console.error('PAGE ERRORS',JSON.stringify(errors));
           console.error('PAGE STATE',JSON.stringify(await page.evaluate(()=>({url:location.href,title:document.title,heading:document.querySelector('h1')?.textContent,ready:document.readyState,guidePages:[...document.querySelectorAll('[data-guide-page]')].map(e=>e.dataset.guidePage),hasData:!!window.EE_DATA,hasGuides:!!window.EE_UPPER_PAGE_GUIDES})).catch(e=>({error:String(e)}))));
           await fs.writeFile('p106-failure-'+name+'.html',await page.content());
           await page.screenshot({path:'tests/screenshots/cross-'+name+'-p106-failure.png',fullPage:true});
           throw error;
          }finally{await browser.close();}'''
          Path('tests/p106-diagnostic.mjs').write_text(s.replace(old,replacement))
          PY
          node --check tests/p106-diagnostic.mjs
      - name: Reproduce original unchanged assertions with API tracing
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/p106-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          set -o pipefail
          for attempt in 1 2 3; do
            DEBUG=pw:api node tests/p106-diagnostic.mjs --cross-browser 2>&1 | tee p106-attempt-$attempt.log
          done
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr49-p106-fallback-diagnostics
          path: |
            p106-attempt-*.log
            p106-failure-*.html
            tests/p106-diagnostic.mjs
            tests/screenshots/cross-*.png
          retention-days: 7
