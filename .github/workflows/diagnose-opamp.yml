name: Verify PR49 OP resize correction
on:
  push:
    branches: ['ops/pr49-opamp-diagnose-20261106']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2d6c8a04733f0fb017dd382aba55f463e012663d
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact candidate and unchanged source owner
        run: |
          test "$(git rev-parse HEAD)" = 2d6c8a04733f0fb017dd382aba55f463e012663d
          test "$(git rev-parse HEAD^{tree})" = fbd89a58d3dcd434ab020ae0f041649ce6b5876f
          test "$(git hash-object workbench/12_opamp_slew_rate/assets/opamp.js)" = 5eb7fb9b4f49a22794d1c5f500c5449f5f6c775c
          git rev-parse HEAD HEAD^{tree} > exact-candidate.txt
      - name: Full engineering and source regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee opamp-node.log
      - name: Install pinned browsers and local PDF assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
          bash scripts/prepare-pdfjs.sh
      - name: Run static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/opamp-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exact OP lifecycle in Chromium Firefox and WebKit
        shell: bash
        run: |
          set -o pipefail
          DEBUG=pw:api node tests/opamp-workbench-smoke.mjs 2>&1 | tee opamp-chromium.log
          DEBUG=pw:api node tests/opamp-workbench-smoke.mjs --cross-browser 2>&1 | tee opamp-cross.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr49-opamp-correction-verification
          path: |
            exact-candidate.txt
            opamp-node.log
            opamp-chromium.log
            opamp-cross.log
            tests/screenshots/cross-*-opamp-*.png
          retention-days: 7
